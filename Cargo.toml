[package]
name = "easyjob"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = [
    ".",
    "crates/*",
    "apps/agent",
    "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.dependencies]
chrono = { version = "0.4.38", features = ["serde"] }
chrono-tz = { version = "0.10.0", features = ["serde"] }
uuid = { version = "1.10.0", features = ["v4", "serde"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
thiserror = "1.0.64"
tokio = { version = "1.40.0", features = ["full"] }
tokio-util = "0.7.12"
async-trait = "0.1.83"
tracing = "0.1.40"
sqlx = { version = "0.8.2", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate"] }

[dev-dependencies]
easyjob-common = { path = "crates/common" }
easyjob-domain = { path = "crates/domain" }
easyjob-executor = { path = "crates/executor" }
easyjob-persistence = { path = "crates/persistence" }
easyjob-platform = { path = "crates/platform" }
easyjob-scheduler = { path = "crates/scheduler" }
easyjob-logging = { path = "crates/logging" }
easyjob-ipc = { path = "crates/ipc" }
easyjob-agent = { path = "apps/agent" }
tempfile = "3"
tokio = { workspace = true }
tokio-util = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

