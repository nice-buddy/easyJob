[package]
name = "easyjob-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
easyjob-common = { path = "../../crates/common" }
easyjob-domain = { path = "../../crates/domain" }
easyjob-platform = { path = "../../crates/platform" }
easyjob-executor = { path = "../../crates/executor" }
easyjob-scheduler = { path = "../../crates/scheduler" }
easyjob-persistence = { path = "../../crates/persistence" }
easyjob-ipc = { path = "../../crates/ipc" }
easyjob-logging = { path = "../../crates/logging" }
fs2 = "0.4.3"
clap = { version = "4.5.18", features = ["derive"] }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
async-trait.workspace = true

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-core-wlan = "0.3.2"
objc2-foundation = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi", "Win32_Networking_WinSock"] }
