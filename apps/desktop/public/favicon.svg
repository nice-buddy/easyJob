<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="lightningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#475569" stroke-width="1.5" />

  <!-- Clock Ring with Glow -->
  <circle cx="32" cy="32" r="18" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="24 6 12 6" opacity="0.9" filter="url(#glow)" />
  
  <!-- Clock Ticks -->
  <circle cx="32" cy="18" r="1.2" fill="#38bdf8" />
  <circle cx="46" cy="32" r="1.2" fill="#38bdf8" />
  <circle cx="32" cy="46" r="1.2" fill="#38bdf8" />
  <circle cx="18" cy="32" r="1.2" fill="#38bdf8" />

  <!-- Dynamic Lightning Bolt Arrow -->
  <path d="M37 12 L22 34 L31 34 L26 52 L44 28 L34 28 Z" fill="url(#lightningGrad)" stroke="#e0e7ff" stroke-width="1" stroke-linejoin="round" filter="url(#glow)" />
</svg>
